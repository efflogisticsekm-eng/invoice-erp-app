name: Daily ERP Report Automation

on:
  schedule:
    # 14:45 UTC is 20:15 IST (8:15 PM IST)
    - cron: '45 14 * * *'
    # 07:30 UTC is 13:00 IST (1:00 PM IST)
    - cron: '30 07 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'daily_evening_report'
        type: choice
        options:
          - daily_evening_report
          - morning
          - evening
          - afternoon_open_lrs
      date:
        description: 'Optional date (YYYY-MM-DD) to run report for a specific day (e.g. 2026-07-03)'
        required: false
        type: string

jobs:
  run-daily-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r helper_scripts/ERP_Daily_Report_Automation/requirements.txt
        playwright install --with-deps chromium

    - name: Run Automation Script
      env:
        ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
        ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "Running manually triggered workflow in ${{ github.event.inputs.mode }} mode..."
          
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TODAY="${{ github.event.inputs.date }}"
            YESTERDAY=$(date -d "$TODAY - 1 day" +%Y-%m-%d)
            DATE_ARG="--from-date $YESTERDAY --to-date $TODAY"
            echo "Using historical dates: $YESTERDAY to $TODAY"
          fi
          
          python helper_scripts/ERP_Daily_Report_Automation/download_and_email.py --mode ${{ github.event.inputs.mode }} $DATE_ARG
        else
          # Check current UTC hour to decide which cron triggered this
          CURRENT_HOUR=$(date -u +"%H")
          if [ "$CURRENT_HOUR" = "07" ]; then
            echo "Running scheduled cron job at 1:00 PM IST (Afternoon Open LRs)..."
            python helper_scripts/ERP_Daily_Report_Automation/download_and_email.py --mode afternoon_open_lrs
          else
            echo "Running scheduled cron job at 8:15 PM IST (Daily Evening Report)..."
            python helper_scripts/ERP_Daily_Report_Automation/download_and_email.py --mode daily_evening_report
          fi
        fi

    - name: Upload Error Screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot
        path: /home/runner/Downloads/erp_temp_downloads/
