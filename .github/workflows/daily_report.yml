name: Daily ERP Report Automation

on:
  schedule:
    # Evening Job at 7:13 PM IST (13:43 UTC)
    - cron: '43 13 * * *'
    # Morning Job at 6:15 AM IST (00:45 UTC)
    - cron: '45 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run Mode (morning or evening)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install Pillow

    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium --with-deps

    - name: Run Automation Script
      env:
        ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
        ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "Running manually triggered workflow in ${{ github.event.inputs.mode }} mode..."
          python helper_scripts/erp_automation/download_and_email.py --mode ${{ github.event.inputs.mode }}
        else
          hour=$(date -u +%H)
          echo "Running scheduled cron job. Current UTC hour is $hour."
          if [ "$hour" -eq 13 ] || [ "$hour" -eq 14 ]; then
            echo "Detected evening scheduled run time..."
            python helper_scripts/erp_automation/download_and_email.py --mode evening
          else
            echo "Detected morning scheduled run time..."
            python helper_scripts/erp_automation/download_and_email.py --mode morning
          fi
        fi

    - name: Upload Error Screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot
        path: /home/runner/Downloads/erp_temp_downloads/
