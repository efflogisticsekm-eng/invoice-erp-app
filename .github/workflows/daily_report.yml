name: Daily ERP Report Automation
run-name: Daily Report [Mode:${{ inputs.mode || 'daily_evening_report' }}]

on:
  schedule:
    # 14:45 UTC is 20:15 IST (8:15 PM IST)
    - cron: '45 14 * * *'
    # Retry every 30 minutes from 8:45 PM IST to 11:45 PM IST if failed
    - cron: '15,45 15,16,17 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'daily_evening_report'
        type: choice
        options:
          - daily_evening_report
          - morning
          - evening
          - afternoon_open_lrs
      from_date:
        description: 'Optional start date (YYYY-MM-DD)'
        required: false
        type: string
      to_date:
        description: 'Optional end date (YYYY-MM-DD)'
        required: false
        type: string
      from_time:
        description: 'Optional start time (HH:MM:SS), defaults to 20:00:00 for evening report'
        required: false
        type: string
      to_time:
        description: 'Optional end time (HH:MM:SS), defaults to 20:00:00 for evening report'
        required: false
        type: string
jobs:
  run-daily-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r helper_scripts/ERP_Daily_Report_Automation/requirements.txt
        playwright install --with-deps chromium

    - name: Check if report already sent today
      id: check_success
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "Running scheduled cron. Checking for previous successful run today..."
          SKIP_STATUS=$(python helper_scripts/ERP_Daily_Report_Automation/check_already_succeeded.py)
          echo "Skip status: $SKIP_STATUS"
          if [ "$SKIP_STATUS" = "skip" ]; then
            echo "Report has already been successfully sent today. Skipping execution."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No successful report run found for today. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "Manually triggered workflow. Always proceeding."
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Run Automation Script
      if: steps.check_success.outputs.skip != 'true'
      env:
        ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
        ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "Running manually triggered workflow in ${{ github.event.inputs.mode }} mode..."
          
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.from_date }}" ]; then
            DATE_ARG="$DATE_ARG --from-date ${{ github.event.inputs.from_date }}"
          fi
          if [ -n "${{ github.event.inputs.to_date }}" ]; then
            DATE_ARG="$DATE_ARG --to-date ${{ github.event.inputs.to_date }}"
          fi
          if [ -n "${{ github.event.inputs.from_time }}" ]; then
            DATE_ARG="$DATE_ARG --from-time ${{ github.event.inputs.from_time }}"
          fi
          if [ -n "${{ github.event.inputs.to_time }}" ]; then
            DATE_ARG="$DATE_ARG --to-time ${{ github.event.inputs.to_time }}"
          fi
          
          echo "Using args: $DATE_ARG"
          python helper_scripts/ERP_Daily_Report_Automation/download_and_email.py --mode ${{ github.event.inputs.mode }} $DATE_ARG
        else
          echo "Running scheduled cron job (Daily Evening Report)..."
          python helper_scripts/ERP_Daily_Report_Automation/download_and_email.py --mode daily_evening_report
        fi

    - name: Upload Debug Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-artifacts
        path: /home/runner/Downloads/erp_temp_downloads/
