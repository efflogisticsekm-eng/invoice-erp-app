name: Daily ERP Automation

on:
  schedule:
    # Runs at 06:30 UTC which is 12:00 PM (Noon) IST every Monday to Saturday (1-6)
    - cron: '30 6 * * 1-6'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'From Date (YYYY-MM-DD)'
        required: false
        type: string
      to_date:
        description: 'To Date (YYYY-MM-DD)'
        required: false
        type: string

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas gspread oauth2client python-dotenv beautifulsoup4 lxml openpyxl Pillow numpy requests
          playwright install --with-deps chromium

      - name: Run ERP Download and Email Flow
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd helper_scripts/ERP_Daily_Report_Automation
          if [ -n "${{ github.event.inputs.from_date }}" ] && [ -n "${{ github.event.inputs.to_date }}" ]; then
            python download_and_email.py --mode daily_evening_report --from-date "${{ github.event.inputs.from_date }}" --to-date "${{ github.event.inputs.to_date }}"
          else
            python download_and_email.py --mode daily_evening_report
          fi

      - name: Run Append Missing LRs Flow
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          cd helper_scripts/ERP_Daily_Report_Automation
          if [ -n "${{ github.event.inputs.from_date }}" ] && [ -n "${{ github.event.inputs.to_date }}" ]; then
            FROM_DATE_DMY=$(date -d "${{ github.event.inputs.from_date }}" +'%d/%m/%Y')
            TO_DATE_DMY=$(date -d "${{ github.event.inputs.to_date }}" +'%d/%m/%Y')
            python append_missing_lrs.py --from-date "$FROM_DATE_DMY" --to-date "$TO_DATE_DMY" --manual
          else
            if [ "${{ github.event_name }}" = "schedule" ]; then
              python append_missing_lrs.py --auto
            else
              python append_missing_lrs.py --manual
            fi
          fi
