name: Daily ERP Automation

on:
  schedule:
    # Runs at 08:00 UTC which is 1:30 PM IST every Monday to Saturday (1-6)
    - cron: '0 8 * * 1-6'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas gspread oauth2client python-dotenv beautifulsoup4 lxml openpyxl Pillow numpy requests
          playwright install --with-deps chromium

      - name: Run ERP Download and Email Flow
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          SENDER_EMAIL: "efflogistics.ekm@gmail.com"
          SENDER_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: "efflogistics.ekm@gmail.com"
        run: |
          cd helper_scripts/ERP_Daily_Report_Automation
          # Run the main flow with --mode daily_evening_report
          # This pulls yesterday's and today's data, emails the report, and updates sheets
          python download_and_email.py --mode daily_evening_report

      - name: Run Append Missing LRs Flow
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          cd helper_scripts/ERP_Daily_Report_Automation
          python append_missing_lrs.py
