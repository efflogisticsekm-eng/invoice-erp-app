name: Daily IOC Xtrapower Diesel Report

on:
  schedule:
    # Runs daily at 12:15 AM IST (18:45 UTC the previous day)
    - cron: '45 18 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-diesel-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r helper_scripts/ERP_Daily_Report_Automation/requirements.txt
        pip install playwright pandas openpyxl numpy
        playwright install --with-deps chromium

    - name: Test site connectivity
      run: |
        echo "Testing HTTP connection to IOC Xtrapower with browser User-Agent..."
        curl -i -s -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -X GET --max-time 15 "https://www.iocxtrapower.com/account/login?returnUrl=%2F" || echo "curl connection failed"

    - name: Run Report Automation Script
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        IOC_USERNAME: ${{ secrets.IOC_USERNAME }}
        IOC_PASSWORD: ${{ secrets.IOC_PASSWORD }}
      run: |
        if [ -n "${{ github.event.inputs.target_date }}" ]; then
          python helper_scripts/ERP_Daily_Report_Automation/download_and_email_diesel.py --date "${{ github.event.inputs.target_date }}"
        else
          python helper_scripts/ERP_Daily_Report_Automation/download_and_email_diesel.py
        fi
