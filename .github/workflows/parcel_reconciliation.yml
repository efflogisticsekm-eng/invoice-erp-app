name: Daily Topay & Paid Parcel Reconciliation
run-name: Parcel Reconciliation Run

on:
  schedule:
    # 06:30 UTC is 12:00 PM IST (12:00 Noon IST)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Optional start date (YYYY-MM-DD)'
        required: false
        type: string
      to_date:
        description: 'Optional end date (YYYY-MM-DD)'
        required: false
        type: string

jobs:
  parcel-reconciliation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r helper_scripts/ERP_Daily_Report_Automation/requirements.txt
        pip install gspread google-auth beautifulsoup4 openpyxl pandas numpy
        playwright install --with-deps chromium

    - name: Create Google Credentials File
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        mkdir -p "ERP nxt Data collection/Invoice_Extractor_Tool"
        echo "$GOOGLE_CREDENTIALS_JSON" > "ERP nxt Data collection/Invoice_Extractor_Tool/credentials.json"

    - name: Run Parcel Freight Reconciliation
      env:
        ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
        ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONPATH: "EFF PARCEL FREIGHT WORKING:helper_scripts/ERP_Daily_Report_Automation"
      run: |
        DATE_ARGS=""
        if [ -n "${{ github.event.inputs.from_date }}" ]; then
          DATE_ARGS="$DATE_ARGS --from-date ${{ github.event.inputs.from_date }}"
        fi
        if [ -n "${{ github.event.inputs.to_date }}" ]; then
          DATE_ARGS="$DATE_ARGS --to-date ${{ github.event.inputs.to_date }}"
        fi
        python helper_scripts/ERP_Daily_Report_Automation/download_and_email.py --mode reconcile $DATE_ARGS

    - name: Upload Debug Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parcel-reconciliation-artifacts
        path: /home/runner/Downloads/erp_temp_downloads/
