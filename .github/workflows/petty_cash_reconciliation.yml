name: Daily Petty Cash Reconciliation
run-name: Daily Petty Cash Reconciliation Run

on:
  schedule:
    # 10:05 UTC is 15:35 IST (3:35 PM IST)
    # This captures all entries up to 3:30 PM and finishes before 4:00 PM IST.
    - cron: '5 10 * * *'
  workflow_dispatch:

jobs:
  reconcile-petty-cash:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r helper_scripts/ERP_Daily_Report_Automation/requirements.txt
        pip install gspread google-auth beautifulsoup4
        playwright install --with-deps chromium

    - name: Create Google Credentials File
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        mkdir -p "ERP nxt Data collection/Invoice_Extractor_Tool"
        echo "$GOOGLE_CREDENTIALS_JSON" > "ERP nxt Data collection/Invoice_Extractor_Tool/credentials.json"

    - name: Download Raw ERP Reports
      env:
        ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
        ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        # Download raw reports (fetches latest lr_raw, despatch_raw, bill_clear and gdm_details)
        python helper_scripts/ERP_Daily_Report_Automation/download_and_email.py --mode petty_cash

    - name: Run Petty Cash Reconciliation Script
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python helper_scripts/ERP_Daily_Report_Automation/petty_cash_reconciliation.py

    - name: Upload Audit Report
      uses: actions/upload-artifact@v4
      with:
        name: petty-cash-audit-report
        path: Petty_Cash_Audit_Report_*.xlsx
